#####################################################################
# ChimpBot settings - one place to tune the proposed macros
# (proposed - not yet installed on the printer)
#####################################################################

[gcode_macro _CHIMP]
description: ChimpBot settings read by the other macros. Edit values here.
# Materials that get chamber treatment (Nevermore on, heat soak)
variable_enclosed_materials: ["ABS", "ASA", "PC", "PA", "NYLON", "PC-CF", "PA-CF", "ABS-GF", "ASA-CF"]
# Minutes to soak for enclosed materials when no chamber sensor / no SOAK= given
variable_soak_minutes_hot: 10
variable_nevermore_speed: 1.0
# Keep the filter running this long after a print (seconds)
variable_nevermore_after_s: 600
# Turn the case lights off this long after a print ends (seconds)
variable_lights_off_after_s: 900
# Default nozzle temps used by LOAD/UNLOAD/PREHEAT when no TEMP= is given
variable_material_temps: {"PLA": 215, "PETG": 245, "ABS": 255, "ASA": 260, "TPU": 230, "PC": 265, "PA": 265}
variable_material_bed: {"PLA": 60, "PETG": 80, "ABS": 105, "ASA": 105, "TPU": 50, "PC": 110, "PA": 90}
variable_default_load_temp: 240
# Where to park for filament changes / pauses (front center, easy to reach)
variable_park_x: 175
variable_park_y: 20
variable_change_z_min: 60
# Clockwork 2 + short hotend: distance from gears to melt zone (mm)
variable_load_length: 60
variable_purge_length: 25
gcode:
  RESPOND TYPE=echo MSG="_CHIMP holds settings only"

# Mainsail's own PAUSE/RESUME/CANCEL_PRINT read this.
# Requires mainsail.cfg from the mainsail-config repo (see IMPROVEMENT_PLAN.md).
[gcode_macro _CLIENT_VARIABLE]
variable_use_custom_pos   : True
variable_custom_park_x    : 175.0
variable_custom_park_y    : 20.0
variable_custom_park_dz   : 10.0
variable_retract          : 1.0
variable_cancel_retract   : 5.0
variable_speed_retract    : 35.0
variable_unretract        : 1.0
variable_speed_unretract  : 35.0
variable_speed_hop        : 15.0
variable_speed_move       : 150.0
variable_park_at_cancel   : True
variable_park_at_cancel_x : 175.0
variable_park_at_cancel_y : 345.0
variable_use_fw_retract   : False
# Keep the printer awake for 12 h while paused (filament changes overnight)
variable_idle_timeout     : 43200
# Set to "filament_switch_sensor runout" once a runout sensor is fitted
variable_runout_sensor    : ""
variable_user_pause_macro : ""
variable_user_resume_macro: ""
variable_user_cancel_macro: "_CHIMP_AFTER_PRINT"
gcode:
