[gcode_macro LOAD_FILAMENT]
gcode:
   ##M109 S250                      ; set extruder to 250, wait for temp
   G1 X175 Y0 Z80                 ; move to servicing position
   M83                            ; set extruder to relative
   G1 E50 F300                    ; load
   G1 E50 F300
   G1 E15 F150                    ; prime nozzle with filament
   M82
   ##M104 S0                        ; set nozzle to 0, don't wait
   ##G1 X340 Y340 Z80                 ; move out of the way
