#####################################################################
# Everyday convenience macros for ChimpBot (proposed)
#####################################################################

[gcode_macro PREHEAT]
description: Preheat for a material (bed + 150C nozzle, Nevermore for ABS/ASA). PREHEAT MATERIAL=ABS
gcode:
  {% set c = printer["gcode_macro _CHIMP"] %}
  {% set mat = params.MATERIAL|default("PLA")|string|upper %}
  {% set bed = params.BED|default(c.material_bed[mat] if mat in c.material_bed else 60)|int %}
  lights_on
  {% if mat in c.enclosed_materials %}
    SET_FAN_SPEED FAN=Nevermore SPEED={c.nevermore_speed}
  {% endif %}
  M140 S{bed}
  M104 S150
  _STATUS MSG="Preheating for {mat}: bed {bed}C"


[gcode_macro COOLDOWN]
description: Heaters and part fan off, filter runs on its timer
gcode:
  TURN_OFF_HEATERS
  M107
  _CHIMP_AFTER_PRINT
  _STATUS MSG="Cooling down"


[gcode_macro PARK_FRONT]
description: Bring the toolhead to the front, raised, to clear or swap the plate
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% set z = [printer.toolhead.position.z, 100]|max %}
  G90
  G1 Z{[z, printer.toolhead.axis_maximum.z]|min} F1500
  G1 X{printer.toolhead.axis_maximum.x / 2} Y20 F12000


[gcode_macro CG28]
description: Home only if not already homed
gcode:
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}


[delayed_gcode _LIGHTS_DIM]
gcode:
  {% if printer.print_stats.state != "printing" %}
    lights_off
  {% endif %}
