#####################################################################
# PRINT_START / PRINT_END for ChimpBot (Voron 2.4 350, Voron Tap)
# (proposed - not yet installed on the printer)
#
# Slicer start gcode (one line):
#   PrusaSlicer / SuperSlicer:
#     PRINT_START BED=[first_layer_bed_temperature] EXTRUDER=[first_layer_temperature] CHAMBER=[chamber_temperature] MATERIAL=[filament_type]
#   OrcaSlicer:
#     PRINT_START BED=[bed_temperature_initial_layer_single] EXTRUDER=[nozzle_temperature_initial_layer] CHAMBER=[chamber_temperature] MATERIAL=[filament_type]
# Slicer end gcode:   PRINT_END
# Turn on "Label objects" in the slicer: it drives adaptive mesh + purge.
#####################################################################

[gcode_macro PRINT_START]
description: Home, heat, level, adaptive mesh, clean and purge. Params BED EXTRUDER [CHAMBER] [MATERIAL] [SOAK=min]
gcode:
  {% set BED = params.BED|default(60)|int %}
  {% set EXTRUDER = params.EXTRUDER|default(240)|int %}
  {% set CHAMBER = params.CHAMBER|default(0)|int %}
  {% set MATERIAL = params.MATERIAL|default("PLA")|string|upper %}
  {% set SOAK = params.SOAK|default(-1)|int %}
  {% set c = printer["gcode_macro _CHIMP"] %}
  {% set enclosed = MATERIAL in c.enclosed_materials %}
  {% set soak_min = SOAK if SOAK >= 0 else (c.soak_minutes_hot if enclosed else 0) %}
  {% set cx = printer.toolhead.axis_maximum.x / 2 %}
  {% set cy = printer.toolhead.axis_maximum.y / 2 %}
  {% set has_chamber = "temperature_sensor chamber" in printer %}

  CLEAR_PAUSE
  BED_MESH_CLEAR
  SET_GCODE_OFFSET Z=0
  lights_on
  UPDATE_DELAYED_GCODE ID=_LIGHTS_DIM DURATION=0
  UPDATE_DELAYED_GCODE ID=filter_off DURATION=0
  _STATUS MSG="Homing"
  G90
  G28

  # Bed heat (+ chamber prep for ABS/ASA etc.)
  {% if enclosed %}
    SET_FAN_SPEED FAN=Nevermore SPEED={c.nevermore_speed}
  {% endif %}
  G1 X{cx} Y{cy} Z15 F9000
  _STATUS MSG="Heating bed to {BED}C"
  M190 S{BED}

  {% if CHAMBER > 0 and has_chamber %}
    _STATUS MSG="Waiting for chamber {CHAMBER}C"
    M106 S255
    TEMPERATURE_WAIT SENSOR="temperature_sensor chamber" MINIMUM={CHAMBER}
    M107
  {% elif soak_min > 0 %}
    _STATUS MSG="Heat soak {soak_min} min"
    M106 S255
    G4 P{soak_min * 60000}
    M107
  {% endif %}

  # Tap: probe with a warm (not hot) nozzle
  _STATUS MSG="Nozzle to 150C for probing"
  M109 S150
  CLEAN_NOZZLE
  _STATUS MSG="Gantry level"
  QUAD_GANTRY_LEVEL
  G28 Z
  _STATUS MSG="Adaptive bed mesh"
  BED_MESH_CALIBRATE ADAPTIVE=1

  # Final heat over the purge bucket so ooze lands in the bucket
  _STATUS MSG="Heating nozzle to {EXTRUDER}C"
  _PARK_OVER_BUCKET
  M109 S{EXTRUDER}
  CLEAN_NOZZLE
  _STATUS MSG="Purging"
  _ADAPTIVE_PURGE
  _STATUS MSG="Printing {MATERIAL}"


[gcode_macro PRINT_END]
description: Retract, park at the back, turn heaters off, filter and lights on timers
gcode:
  {% set th = printer.toolhead %}
  {% set z_park = [th.position.z + 20, th.axis_maximum.z]|min %}
  M400
  M83
  G1 E-3 F2400
  G91
  G1 Z2 F3000
  G90
  G1 Z{z_park} F1200
  G1 X{th.axis_maximum.x / 2} Y{th.axis_maximum.y - 5} F18000
  TURN_OFF_HEATERS
  M107
  BED_MESH_CLEAR
  _CHIMP_AFTER_PRINT
  _STATUS MSG="Print finished"


[gcode_macro _CHIMP_AFTER_PRINT]
description: Shared clean-up for PRINT_END and CANCEL_PRINT
gcode:
  {% set c = printer["gcode_macro _CHIMP"] %}
  {% if printer["fan_generic Nevermore"].speed > 0 %}
    UPDATE_DELAYED_GCODE ID=filter_off DURATION={c.nevermore_after_s}
  {% endif %}
  UPDATE_DELAYED_GCODE ID=_LIGHTS_DIM DURATION={c.lights_off_after_s}


[gcode_macro _STATUS]
description: Show a status line on the LCD, KlipperScreen and Mainsail console
gcode:
  {% set msg = params.MSG|default("")|string %}
  SET_DISPLAY_TEXT MSG="{msg}"
  RESPOND TYPE=echo MSG="ChimpBot: {msg}"


[gcode_macro _PARK_OVER_BUCKET]
description: Move above the purge bucket at a safe height
gcode:
  {% set n = printer["gcode_macro clean_nozzle"] %}
  {% set y = printer.toolhead.axis_maximum.y %}
  G90
  G1 Z{n.brush_top + n.clearance_z + 5} F1500
  G1 X{n.bucket_start + n.bucket_left_width / 2} Y{y} F9000


[gcode_macro _ADAPTIVE_PURGE]
description: Short purge line just in front of the first object (uses exclude_object data)
gcode:
  {% set pts = printer.exclude_object.objects|map(attribute='polygon')|sum(start=[]) %}
  {% set max_x = printer.toolhead.axis_maximum.x %}
  {% set min_x = pts|map(attribute=0)|min|default(60) %}
  {% set min_y = pts|map(attribute=1)|min|default(30) %}
  {% set length = 50 %}
  {% set x0 = [min_x - 5, 10]|max %}
  {% set x0 = [x0, max_x - length - 10]|min %}
  {% set y0 = [min_y - 8, 5]|max %}
  G90
  G1 X{x0} Y{y0} Z5 F12000
  G1 Z0.6 F1200
  M83
  G1 E3 F300
  G1 X{x0 + length} E12 F1200
  G1 E-0.5 F2400
  G1 Z2 F1200
