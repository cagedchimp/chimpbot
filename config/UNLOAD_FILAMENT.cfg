[gcode_macro UNLOAD_FILAMENT]
gcode:
   ##M109 S250                      ; set extruder temp to 250, wait for temp
   M83                            ; set extruder to relative
   G1 X175 Y0 Z80                 ; move to servicing position
   G1 E10 F300                    ; extrude a little to soften tip
   G1 E-10 F3000                  ; jerk the filament out of the melt zone
   G1 E-50 F1800                  ; retract the rest of the way
   G1 E-30 F900                   ; retract the rest of the way
   M82
   ##M104 S0                        ; set extruder temp to 0, don't wait
   G1 X340 Y340 Z80               ; move extruder out of the way
