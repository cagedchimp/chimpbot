#####################################################################
# Filament handling for ChimpBot (Clockwork 2, direct drive)
# (proposed - replaces LOAD/UNLOAD/M600 from kiauh_macros.cfg)
#####################################################################

[gcode_macro LOAD_FILAMENT]
description: Heat if needed, load and purge. [MATERIAL=PETG] or [TEMP=245]
gcode:
  {% set c = printer["gcode_macro _CHIMP"] %}
  {% set mat = params.MATERIAL|default("")|string|upper %}
  {% set fallback = printer.extruder.target if printer.extruder.target >= 180 else c.default_load_temp %}
  {% set temp = params.TEMP|default(c.material_temps[mat] if mat in c.material_temps else fallback)|int %}
  {% set L = c.load_length %}
  _FILAMENT_PARK
  _STATUS MSG="Load: heating to {temp}C"
  M109 S{temp}
  SAVE_GCODE_STATE NAME=_chimp_load
  M83
  _STATUS MSG="Loading"
  G1 E10 F300
  G1 E{L - 10} F600
  G1 E{c.purge_length} F240
  G1 E-1 F2400
  RESTORE_GCODE_STATE NAME=_chimp_load
  _STATUS MSG="Filament loaded"


[gcode_macro UNLOAD_FILAMENT]
description: Heat if needed, form a clean tip and unload. [MATERIAL=PETG] or [TEMP=245]
gcode:
  {% set c = printer["gcode_macro _CHIMP"] %}
  {% set mat = params.MATERIAL|default("")|string|upper %}
  {% set fallback = printer.extruder.target if printer.extruder.target >= 180 else c.default_load_temp %}
  {% set temp = params.TEMP|default(c.material_temps[mat] if mat in c.material_temps else fallback)|int %}
  {% set L = c.load_length %}
  _FILAMENT_PARK
  _STATUS MSG="Unload: heating to {temp}C"
  M109 S{temp}
  SAVE_GCODE_STATE NAME=_chimp_unload
  M83
  _STATUS MSG="Unloading"
  G1 E5 F300
  G1 E-10 F3000
  G4 P1500
  G1 E5 F600
  G1 E-15 F3000
  G1 E-{L / 2} F1800
  G1 E-{L / 2} F1800
  RESTORE_GCODE_STATE NAME=_chimp_unload
  _STATUS MSG="Filament unloaded"


[gcode_macro PURGE_MORE]
description: Push a little more filament through (default 15 mm)
gcode:
  {% set amount = params.E|default(15)|float %}
  {% if printer.extruder.can_extrude %}
    SAVE_GCODE_STATE NAME=_chimp_purge
    M83
    G1 E{amount} F240
    G1 E-1 F2400
    RESTORE_GCODE_STATE NAME=_chimp_purge
  {% else %}
    RESPOND TYPE=error MSG="Nozzle too cold to purge"
  {% endif %}


[gcode_macro M600]
description: Filament change - park, unload, then a Mainsail dialog walks you through it
gcode:
  {% set c = printer["gcode_macro _CHIMP"] %}
  PAUSE X={c.park_x} Y={c.park_y} Z_MIN={c.change_z_min}
  UNLOAD_FILAMENT
  _FILAMENT_PROMPT


[gcode_macro _FILAMENT_PROMPT]
gcode:
  RESPOND TYPE=command MSG="action:prompt_begin Filament change"
  RESPOND TYPE=command MSG="action:prompt_text Old filament is out. Insert the new filament into the extruder, then press Load."
  RESPOND TYPE=command MSG="action:prompt_button Load|LOAD_FILAMENT|primary"
  RESPOND TYPE=command MSG="action:prompt_button Purge more|PURGE_MORE|secondary"
  RESPOND TYPE=command MSG="action:prompt_footer_button Resume print|RESUME|success"
  RESPOND TYPE=command MSG="action:prompt_show"


[gcode_macro _FILAMENT_PARK]
description: Park front-center for filament work, unless paused (already parked) or not homed
gcode:
  {% set c = printer["gcode_macro _CHIMP"] %}
  {% if not printer.pause_resume.is_paused and "xyz" in printer.toolhead.homed_axes %}
    {% set z = [printer.toolhead.position.z, c.change_z_min]|max %}
    G90
    G1 Z{z} F1500
    G1 X{c.park_x} Y{c.park_y} F9000
  {% endif %}
